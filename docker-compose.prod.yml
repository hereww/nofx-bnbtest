# NOFX Production Deployment
# 用户部署专用 - 使用官方预构建镜像
#
# 一键部署命令:
# curl -fsSL https://raw.githubusercontent.com/NoFxAiOS/nofx/main/install.sh | bash
#
# 或手动部署:
# curl -O https://raw.githubusercontent.com/NoFxAiOS/nofx/main/docker-compose.prod.yml
# docker compose -f docker-compose.prod.yml up -d

services:
  nofx-data-gateway:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.data-gateway
    container_name: nofx-data-gateway
    restart: unless-stopped
    ports:
      - "${DATA_GATEWAY_PORT:-8090}:8090"
    volumes:
      - ./data:/app/data
      - /etc/localtime:/etc/localtime:ro
    env_file:
      - .env
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      - DATA_GATEWAY_ADDR=:8090
      - DATA_GATEWAY_DB_PATH=${DATA_GATEWAY_DB_PATH:-data/data-gateway.db}
      - DATA_GATEWAY_REFRESH_INTERVAL=${DATA_GATEWAY_REFRESH_INTERVAL:-1m}
      - HTTP_PROXY=${HTTP_PROXY:-}
      - HTTPS_PROXY=${HTTPS_PROXY:-}
      - ALL_PROXY=${ALL_PROXY:-}
      - NO_PROXY=${NO_PROXY:-localhost,127.0.0.1,::1,nofx,nofx-frontend,nofx-data-gateway}
      - http_proxy=${http_proxy:-}
      - https_proxy=${https_proxy:-}
      - all_proxy=${all_proxy:-}
      - no_proxy=${no_proxy:-localhost,127.0.0.1,::1,nofx,nofx-frontend,nofx-data-gateway}
    networks:
      - nofx-network
    healthcheck:
      test: ["CMD", "env", "-u", "HTTP_PROXY", "-u", "HTTPS_PROXY", "-u", "ALL_PROXY", "-u", "http_proxy", "-u", "https_proxy", "-u", "all_proxy", "wget", "-q", "-O", "-", "http://127.0.0.1:8090/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  nofx:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.backend
    container_name: nofx-trading
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      - "${NOFX_BACKEND_PORT:-8080}:8080"
    volumes:
      # Data directory for database and logs
      - ./data:/app/data
      - /etc/localtime:/etc/localtime:ro
    env_file:
      - .env
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      - AI_MAX_TOKENS=8000
      - DATA_GATEWAY_URL=${DATA_GATEWAY_URL:-http://nofx-data-gateway:8090}
      - HTTP_PROXY=${HTTP_PROXY:-}
      - HTTPS_PROXY=${HTTPS_PROXY:-}
      - ALL_PROXY=${ALL_PROXY:-}
      - NO_PROXY=${NO_PROXY:-localhost,127.0.0.1,::1},nofx,nofx-frontend,nofx-data-gateway
      - http_proxy=${http_proxy:-}
      - https_proxy=${https_proxy:-}
      - all_proxy=${all_proxy:-}
      - no_proxy=${no_proxy:-localhost,127.0.0.1,::1},nofx,nofx-frontend,nofx-data-gateway
    networks:
      - nofx-network
    depends_on:
      - nofx-data-gateway
    healthcheck:
      test: ["CMD", "env", "-u", "HTTP_PROXY", "-u", "HTTPS_PROXY", "-u", "ALL_PROXY", "-u", "http_proxy", "-u", "https_proxy", "-u", "all_proxy", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  nofx-frontend:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.frontend
    container_name: nofx-frontend
    restart: unless-stopped
    ports:
      - "${NOFX_FRONTEND_PORT:-3000}:80"
    networks:
      - nofx-network
    depends_on:
      - nofx
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

networks:
  nofx-network:
    external: true
    name: nofx-network
